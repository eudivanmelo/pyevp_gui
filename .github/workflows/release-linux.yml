name: Build Linux Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Locate native wrapper
        id: wrapper
        run: |
          WRAPPER_PATH=$(python -c 'from pathlib import Path; import pylibevp; print(Path(pylibevp.__file__).resolve().parent / "bin" / "libevp_wrapper.so")')
          if [ ! -f "$WRAPPER_PATH" ]; then
            echo "Native wrapper not found at $WRAPPER_PATH"
            exit 1
          fi
          echo "path=$WRAPPER_PATH" >> "$GITHUB_OUTPUT"

      - name: Build executable
        run: |
          PYTHONPATH=src pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --paths src \
            --collect-all customtkinter \
            --collect-all darkdetect \
            --hidden-import pyevp_gui.app \
            --add-data "${{ steps.wrapper.outputs.path }}:pylibevp/bin" \
            --name pyevp-gui \
            run.py

      - name: Package release artifact
        run: |
          mkdir -p release
          tar -C dist -czf release/pyevp-gui-linux-x86_64.tar.gz pyevp-gui

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0-${GITHUB_RUN_NUMBER}-alpha"
          gh release create "$TAG" \
            release/pyevp-gui-linux-x86_64.tar.gz \
            --title "PyEVP GUI Linux build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated Linux build generated from commit ${GITHUB_SHA}." \
            --prerelease \
            --target "$GITHUB_SHA"